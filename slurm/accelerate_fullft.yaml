# UNTESTED: written on a machine with no GPU and no accelerate/deepspeed
# multi-process launch has ever run here. Verify against the mlp cluster's
# actual deepspeed/accelerate versions before trusting it.
#
# Minimal DeepSpeed ZeRO stage 2 config for the full-FT point-check
# (slurm/train_fullft.sbatch, --gres=gpu:h100:2): shards optimizer state and
# gradients across the two H100s so full fp32 AdamW state (~85 GB, see
# slurm/train.sbatch's two-GPU comment) fits under two 80 GB cards. No
# offload (design choice, builder, 2026-09-04): CPU/NVMe offload would slow
# a single point-check run more than it helps, and is the second open
# question in slurm/train_fullft.sbatch's header (optimizer sharding
# memory) -- add offload here if ZeRO-2 alone still OOMs.
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  zero_stage: 2
  offload_optimizer_device: none
  offload_param_device: none
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
mixed_precision: bf16
num_machines: 1
num_processes: 2
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
